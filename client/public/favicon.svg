<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="kaltech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061637" />
      <stop offset="100%" stop-color="#0f2b67" />
    </linearGradient>
    <linearGradient id="kaltech-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="kaltech-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#kaltech-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#kaltech-accent)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- KalTech Geometric "K" Icon -->
  <g filter="url(#glow)">
    <!-- Vertical Bar of K -->
    <rect x="15" y="15" width="8" height="34" rx="4" fill="url(#kaltech-blue)" />

    <!-- Top Diagonal Arm -->
    <path d="M22 32 L38 16 C39.5 14.5 42 15.5 42 17.5 L42 22 C42 23.2 41.3 24.3 40.3 25.1 L29 34 L22 32 Z" fill="url(#kaltech-accent)" />

    <!-- Bottom Diagonal Leg -->
    <path d="M27 30 L43.5 47.5 C44.8 49 43.8 51 42 51 L36 51 C34.8 51 33.7 50.4 33 49.5 L22 36 L27 30 Z" fill="url(#kaltech-blue)" />

    <!-- Core Tech Connector Node -->
    <circle cx="27" cy="32" r="3" fill="#ffffff" />
  </g>
</svg>