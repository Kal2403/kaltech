services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongo:
    image: mongo:7-jammy
    container_name: kaltech-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: kaltech
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - kaltech-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Backend API Service (Node.js Express)
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kaltech-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/kaltech}
      CLIENT_URL: ${CLIENT_URL:-http://localhost,http://localhost:80,http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-kaltech_production_jwt_secret_change_me_in_env_file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador KalTech}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kaltech.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-KalTech <notificaciones@kaltech.com>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - kaltech-network

  # ==========================================
  # Frontend Web Client (React + Nginx)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
        VITE_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
    container_name: kaltech-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - kaltech-network

networks:
  kaltech-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
